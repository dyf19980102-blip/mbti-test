<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>人格类型测试</title>

<style>
:root{
  --bg:#F2F1EE; --card:#FFFFFF; --ink:#24262F;
  --ink2:#5B5F6B; --ink3:#9A9DA8; --line:#E4E3DE;
  --analyst:#6B5BD2; --diplomat:#2E9E6B; --sentinel:#3D7EBA; --explorer:#D8A32F;
  --accent:#3D7EBA; --accent-soft:#EEF3F8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.6;
  display:flex;align-items:flex-start;justify-content:center;min-height:100vh;
}
.phone{
  width:390px;height:844px;background:var(--bg);
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;
  box-shadow:0 0 0 1px rgba(0,0,0,.08),0 24px 60px rgba(0,0,0,.14);
}
@media(max-width:430px){
  body{display:block;}
  .phone{width:100vw;height:100vh;height:100dvh;box-shadow:none;border-radius:0;}
}
@media(min-width:431px){ .phone{border-radius:28px;margin:24px 0;} }

.screen{position:absolute;inset:0;display:flex;flex-direction:column;
  background:var(--bg);opacity:0;pointer-events:none;
  transform:translateY(10px);transition:opacity .28s ease,transform .28s ease;}
.screen.on{opacity:1;pointer-events:auto;transform:none;z-index:2;}

/* ---------- 封面 ---------- */
.cover{flex:1;display:flex;flex-direction:column;padding:0 26px 34px;overflow-y:auto;}
.cover-hero{padding:54px 0 22px;}
.cover-badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;letter-spacing:.04em;
  color:var(--ink2);background:#fff;border:1px solid var(--line);
  padding:5px 11px;border-radius:20px;}
.cover-badge i{width:6px;height:6px;border-radius:50%;background:var(--diplomat);}
h1.cover-title{font-size:31px;line-height:1.28;font-weight:700;margin:16px 0 10px;letter-spacing:-.5px;}
.cover-title em{font-style:normal;color:var(--analyst);}
.cover-desc{font-size:14px;color:var(--ink2);margin:0 0 20px;}
.steps{background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px 16px;margin-bottom:14px;}
.step{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line);}
.step:last-child{border-bottom:none;}
.step .n{width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;
  font-size:11px;display:flex;align-items:center;justify-content:center;flex:none;margin-top:2px;}
.step .tx{font-size:13.5px;}
.step .tx b{font-weight:600;display:block;}
.step .tx span{color:var(--ink3);font-size:12px;}
.metaline{display:flex;gap:14px;font-size:12px;color:var(--ink3);
  padding:12px 2px 0;justify-content:center;}
.btn-primary{width:100%;padding:16px;border-radius:14px;border:none;
  background:var(--ink);color:#fff;font-size:16px;font-weight:600;font-family:inherit;
  letter-spacing:.02em;}
.btn-primary:active{opacity:.85;}
.btn-ghost{width:100%;padding:13px;border-radius:14px;border:1px solid var(--line);
  background:transparent;color:var(--ink2);font-size:14px;font-family:inherit;margin-top:10px;}
.cover-foot{font-size:11.5px;color:var(--ink3);text-align:center;padding-top:14px;}

/* ---------- 答题 ---------- */
#s-quiz{overflow:hidden;background:#FFFFFF;}
.q-bar{padding:calc(12px + env(safe-area-inset-top)) 16px 0;background:var(--card);
  border-bottom:1px solid var(--line);}
.q-bar-top{display:flex;align-items:center;justify-content:space-between;height:30px;}
.q-back{display:flex;align-items:center;gap:3px;font-size:13px;color:var(--ink2);
  background:none;border:none;padding:4px 6px 4px 0;font-family:inherit;}
.q-back.hide{visibility:hidden;}
.q-count{font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums;}
.q-count b{color:var(--ink);font-weight:600;}
.seg{display:flex;gap:3px;margin:10px 0 12px;}
.seg i{flex:1;height:4px;border-radius:2px;background:#E9E8E3;overflow:hidden;}
.seg i b{display:block;height:100%;width:0;border-radius:2px;background:#3D4E7A;
  transition:width .5s cubic-bezier(.05,.7,.1,1);}
.q-body{flex:1;display:flex;flex-direction:column;justify-content:center;
  padding:0 30px;text-align:center;min-height:0;}
.q-stage{will-change:transform,opacity;}
.q-mind{font-size:12px;color:var(--ink3);letter-spacing:.08em;margin-bottom:16px;}
.q-text{font-size:22px;line-height:1.5;font-weight:500;letter-spacing:-.2px;}

/* 选项区：浮起白卡，整体抬到拇指舒适区 */
.q-foot{flex:none;margin:30px 14px 0;padding:20px 16px 18px;}
.scale-tip{text-align:center;font-size:13.5px;font-weight:600;
  height:22px;margin-bottom:12px;opacity:0;transition:opacity .18s;}
.scale-tip.on{opacity:1;}

/* 圆圈直径编码强度、颜色编码方向；整槽为点击热区，小圆也好点 */
.scale{display:flex;gap:2px;align-items:center;}
.dot{flex:1;height:56px;display:flex;align-items:center;justify-content:center;
  border:none;background:none;padding:0;cursor:pointer;font-family:inherit;}
.dot i{display:block;width:var(--sz);height:var(--sz);border-radius:50%;
  border:2px solid var(--ring);background:transparent;
  transition:background .16s,border-width .16s,transform .16s;}
.dot.sel i{background:var(--ring);border-width:3px;transform:scale(1.08);}
.dot:active i{transform:scale(.86);}
@keyframes dotPop{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1.08)}}
.dot.pop i{animation:dotPop .34s cubic-bezier(.34,1.35,.64,1);}
.scale-ends{display:flex;justify-content:space-between;font-size:14px;font-weight:600;
  margin-top:14px;padding:0 6px;}
.scale-ends .ag{color:#2A9E6B;}
.scale-ends .dg{color:#6F5FB8;}
/* 底部留白承担屏幕高度差异：矮屏优先压缩这里，选项位置不动 */
.q-below{flex:0 1 auto;height:calc(158px + env(safe-area-inset-bottom));
  min-height:48px;}
@media (prefers-reduced-motion: reduce){
  .dot.pop i{animation:none;}
  .seg i b{transition:none;}
  .screen{transition:opacity .12s;transform:none;}
}
@media (max-height:720px){
  .q-text{font-size:20px;}
  .q-foot{margin-top:20px;padding:15px 16px 13px;}
  .q-below{height:calc(112px + env(safe-area-inset-bottom));}
}
.scale-ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink3);
  margin-top:9px;padding:0 2px;}

/* ---------- 计算中 ---------- */
.calc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;padding:0 40px;text-align:center;}
.orb{width:96px;height:96px;border-radius:50%;
  background:radial-gradient(circle at 35% 32%,#8FA9D8,#3D4E7A);}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.92}50%{transform:scale(1.07);opacity:1}}
.calc .orb{animation:pulse 1.5s ease-in-out infinite;}
.calc-t{font-size:17px;font-weight:600;}
.calc-s{font-size:13px;color:var(--ink3);}
.calc-bar{width:180px;height:3px;background:#E4E3DE;border-radius:2px;overflow:hidden;}
.calc-bar i{display:block;height:100%;width:0;background:var(--ink);transition:width .4s linear;}

/* ---------- 结果 ---------- */
.res{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:40px;}
.res-hero{padding:calc(20px + env(safe-area-inset-top)) 24px 22px;text-align:center;}
.res-code{font-size:44px;font-weight:700;letter-spacing:2px;line-height:1;
  color:var(--accent);}
.res-name{font-size:19px;font-weight:600;margin-top:8px;}
.res-role{display:inline-block;font-size:11.5px;padding:4px 12px;border-radius:20px;
  margin-top:9px;background:rgba(255,255,255,.22);}
.res-line{font-size:13.5px;color:var(--ink2);margin:14px auto 0;max-width:290px;}

.dims{background:var(--card);border-radius:16px;margin:0 16px;padding:6px 16px 12px;}
.dim{padding:12px 0;border-bottom:1px solid var(--line);}
.dim:last-child{border-bottom:none;}
.dim-top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:7px;}
.dim-top b{font-weight:600;}
.dim-top span{color:var(--accent);font-weight:600;}
.dim-track{display:flex;height:6px;border-radius:3px;overflow:hidden;background:#EDECE8;}
.dim-track i{display:block;}
.dim-key{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);margin-top:7px;}
.dim-key b{color:var(--ink2);font-weight:600;}

.sec{background:var(--card);border-radius:16px;margin:14px 16px 0;padding:18px 18px 20px;}
.sec h3{font-size:15px;font-weight:600;margin:0 0 16px;}
/* 特质用流式标签：条目数不同也不会出现两栏对不齐 */
.trait{margin-bottom:18px;}
.trait:last-child{margin-bottom:0;}
.trait-h{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;
  color:var(--ink2);margin-bottom:10px;}
.trait-h::before{content:'';width:3px;height:13px;border-radius:2px;background:var(--accent);}
.trait-h.warn::before{background:#8A8D96;}
.chips{display:flex;flex-wrap:wrap;gap:7px;}
.chips span{font-size:12.5px;line-height:1.45;padding:7px 11px;border-radius:9px;
  border:1px solid transparent;background:var(--accent-soft);color:var(--ink);}
/* 主题色有可能是金/绿/蓝/紫，靠色相分不开两组，改用「填充 vs 描边」区分 */
.chips.warn span{background:#FFFFFF;border:1px solid #DEDBD2;color:#5F5E5A;}

/* ---------- 深度报告 ---------- */
.rep{background:var(--card);border-radius:16px;margin:14px 16px 0;padding:20px 18px 22px;}
.rep-h{display:flex;align-items:center;gap:8px;font-size:15.5px;font-weight:600;margin:0 0 14px;}
.rep-h::before{content:'';width:3px;height:15px;border-radius:2px;background:var(--accent);}
.rep-sub{font-size:12.5px;font-weight:600;color:var(--accent);margin:16px 0 7px;}
.rep-sub:first-child{margin-top:0;}
.rep-t{font-size:13.5px;line-height:1.88;color:var(--ink);margin:0 0 12px;}
.rep-t:last-child{margin-bottom:0;}
.rep-t b{font-weight:600;}
.cf{display:flex;flex-direction:column;gap:10px;}
.cf-row{display:flex;gap:10px;align-items:flex-start;}
.cf-badge{flex:none;width:36px;height:36px;border-radius:11px;display:flex;align-items:center;
  justify-content:center;font-size:12.5px;font-weight:700;color:#fff;letter-spacing:-.2px;}
.cf-body{flex:1;min-width:0;}
.cf-body b{display:block;font-size:13px;font-weight:600;margin-bottom:2px;}
.cf-body span{font-size:12.5px;color:var(--ink2);line-height:1.62;}
.rep-note{font-size:11.5px;color:var(--ink3);line-height:1.75;margin:16px 0 0;
  padding-top:14px;border-top:1px solid var(--line);}
.rep-tail{font-size:11.5px;color:var(--ink3);line-height:1.75;margin:18px 20px 0;text-align:center;}

.share-card{margin:16px 16px 0;background:var(--card);border-radius:16px;padding:16px;text-align:center;}
.share-card img{width:100%;aspect-ratio:690/1040;object-fit:contain;border-radius:12px;
  display:block;background:#F2F1EE;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;}
.share-btn{margin-top:14px;}
.stage-canvas{position:absolute;left:-9999px;top:0;width:1px;height:1px;opacity:0;pointer-events:none;}

/* ---- 分享面板 ---- */
.sheet-mask{position:absolute;inset:0;background:rgba(20,22,30,.42);opacity:0;
  pointer-events:none;transition:opacity .22s;z-index:60;}
.sheet-mask.on{opacity:1;pointer-events:auto;}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;
  border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(103%);transition:transform .3s cubic-bezier(.05,.7,.1,1);z-index:61;}
.sheet.on{transform:none;}
.sheet-head{display:flex;justify-content:space-between;align-items:center;height:28px;}
.sheet-head h4{font-size:16px;font-weight:600;margin:0;}
.sheet-x{border:none;background:none;font-size:13px;color:var(--ink3);
  padding:4px;font-family:inherit;cursor:pointer;}
.sheet-note{font-size:13px;color:var(--ink2);line-height:1.7;margin:12px 0 16px;
  background:#F7F6F2;border-radius:10px;padding:12px 14px;}
.sheet-note b{color:var(--ink);font-weight:600;}
.sheet-opt{width:100%;padding:15px;border:1px solid var(--line);border-radius:12px;
  background:#fff;margin-bottom:10px;font-size:14.5px;font-family:inherit;
  color:var(--ink);cursor:pointer;}
.sheet-opt:active{background:#F7F6F2;}

.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  background:rgba(36,38,47,.94);color:#fff;font-size:13.5px;padding:11px 18px;
  border-radius:10px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99;}
.toast.on{opacity:1;}
</style>
</head>
<body>

<div class="phone">

  <!-- ============ 封面 ============ -->
  <section class="screen on" id="s-cover">
    <div class="cover">
      <div class="cover-hero">
        <span class="cover-badge"><i></i>60 题 · 约 8 分钟</span>
        <h1 class="cover-title">你是哪一种<em>人格类型</em>？</h1>
        <p class="cover-desc">基于荣格心理类型学的四维模型，测出你的 16 型人格代码与完整画像。</p>
      </div>

      <div class="steps">
        <div class="step"><div class="n">1</div><div class="tx"><b>完成 60 道题</b><span>凭第一直觉作答，没有对错</span></div></div>
        <div class="step"><div class="n">2</div><div class="tx"><b>得到你的四字母人格代码</b><span>五维倾向强度一览</span></div></div>
        <div class="step"><div class="n">3</div><div class="tx"><b>立即查看完整深度报告</b><span>共 10 个部分 · 约 8 分钟读完</span></div></div>
      </div>

      <div class="metaline"><span>无需注册</span><span>·</span><span>可中断续答</span><span>·</span><span>结果可保存分享</span></div>

      <div style="flex:1;min-height:20px;"></div>
      <button class="btn-primary" onclick="startTest()">开始测试</button>
      <button class="btn-ghost" onclick="startTest(true)">我已中断过，继续上次进度</button>
    </div>
  </section>

  <!-- ============ 答题 ============ -->
  <section class="screen" id="s-quiz">
    <div class="q-bar">
      <div class="q-bar-top">
        <button class="q-back" id="btnBack" onclick="prevQ()">‹ 上一题</button>
        <div class="q-count"><b id="qNow">1</b> / <span id="qTotal">60</span></div>
      </div>
      <div class="seg" id="seg"></div>
    </div>

    <div class="q-body">
      <div class="q-stage" id="qStage">
        <div class="q-mind" id="qMind">能量方向</div>
        <div class="q-text" id="qText"></div>
      </div>
    </div>

    <div class="q-foot">
      <div class="scale-tip" id="scaleTip"></div>
      <div class="scale" id="scale"></div>
      <div class="scale-ends"><span class="ag">同意</span><span class="dg">不同意</span></div>
    </div>

    <div class="q-below"></div>
  </section>

  <!-- ============ 计算中 ============ -->
  <section class="screen" id="s-calc">
    <div class="calc">
      <div class="orb"></div>
      <div class="calc-t">正在生成你的人格画像</div>
      <div class="calc-s" id="calcS">正在比对 16 种类型原型…</div>
      <div class="calc-bar"><i id="calcBar"></i></div>
    </div>
  </section>

  <!-- ============ 结果 ============ -->
  <section class="screen" id="s-result">
    <div class="res">
      <div class="res-hero" id="resHero">
        <div class="res-code" id="resCode">INFP</div>
        <div class="res-name" id="resName"></div>
        <div class="res-role" id="resRole"></div>
        <div class="res-line" id="resLine"></div>
      </div>

      <div class="dims" id="dims"></div>

      <div class="sec">
        <h3>你的核心特质</h3>
        <div class="trait">
          <div class="trait-h">优势</div>
          <div class="chips" id="strengths"></div>
        </div>
        <div class="trait">
          <div class="trait-h warn">需要注意</div>
          <div class="chips warn" id="weakness"></div>
        </div>
      </div>

      <div id="reportBox"></div>

      <div class="share-card">
        <img id="cardImg" alt="你的人格类型卡片" draggable="false">
        <button class="btn-primary share-btn" onclick="shareCard()">分享结果卡片</button>
      </div>
      <canvas id="shareCanvas" width="690" height="1040" class="stage-canvas"></canvas>

      <div class="sheet-mask" id="sheetMask" onclick="closeSheet()"></div>
      <div class="sheet" id="shareSheet">
        <div class="sheet-head">
          <h4>分享测试结果</h4>
          <button class="sheet-x" onclick="closeSheet()" aria-label="关闭">关闭</button>
        </div>
        <p class="sheet-note" id="sheetNote"></p>
        <button class="sheet-opt" onclick="copyLink()">复制测试链接</button>
        <button class="sheet-opt" onclick="saveCard()">保存图片到相册</button>
      </div>

      <div style="padding:18px 16px 0;">
        <button class="btn-ghost" onclick="restart()">重新测试一次</button>
      </div>
    </div>
  </section>

  <div class="toast" id="toast"></div>
</div>

<script>
/* 结果卡片底部那行小字。填上你的账号，卡片被转发时就自带一个导流位。
   例如：'小红书 @你的账号'；留空则显示默认的中性文案。 */
const CARD_FOOT_TEXT = '';

/* ============ 题库：60 题，5 个维度各 12 题 ============ */
const G = {
  EI:[
    ['认识新朋友对我来说是件轻松的事',1],['参加热闹的聚会后，我通常更有精神而不是更累',1],
    ['我习惯边说边把想法理清，而不是想清楚再开口',1],['长时间独处会让我感到空落落的',1],
    ['我倾向于先行动，再考虑后果',1],['别人很容易看出我当下的情绪',1],
    ['在群里我常常只看不说话，私聊时反而愿意多聊几句',-1],['我更习惯在安静的环境里完成重要的事',-1],
    ['社交之后我需要一段独处时间来充电',-1],['我不太主动给不太熟的人发消息',-1],
    ['我的朋友圈子不大，但关系都很深',-1],['比起被一群人围着，我更喜欢和一两个人深聊',-1]
  ],
  SN:[
    ['相比"这意味着什么"，我更在意"具体发生了什么"',1],['我喜欢用已经被验证过的方法做事',1],
    ['我更相信亲眼看到、亲手验证过的信息',1],['做计划时我先确认现实条件，而不是先设想可能性',1],
    ['我对生活里的具体事实和数字记得很清楚',1],['抽象理论要能立刻派上用场，我才有兴趣',1],
    ['我常在不相关的信息之间看到别人没注意到的联系',-1],['比起眼前的事实，我更容易被未来的可能性吸引',-1],
    ['我经常走神，脑子里冒出和当下无关的想法',-1],['我喜欢琢磨"如果……会怎样"这类问题',-1],
    ['读一段文字时，我通常先抓住整体含义而不是细节',-1],['复杂新颖的想法比简单直接的想法更让我兴奋',-1]
  ],
  TF:[
    ['做决定时，我把"是否合理"放在"别人怎么想"前面',1],['我不容易被情绪化的说辞打动',1],
    ['即使实话伤人，我也倾向于直接说出来',1],['我评价一个观点只看逻辑是否成立，不看谁说的',1],
    ['我认为规则应该一视同仁，特殊情况也不该例外',1],['别人向我倾诉时，我的第一反应是帮他分析问题',1],
    ['别人难过时，我很容易被带进去一起难受',-1],['为了维护关系里的和谐，我愿意让步',-1],
    ['做重要决定时，我会认真考虑它对身边人的影响',-1],['我更在意"对不对得起良心"，而不是"逻辑成不成立"',-1],
    ['我常因为怕伤害别人而把话咽回去',-1],['得到他人的认可对我来说很重要',-1]
  ],
  JP:[

/* ============ 组卷：60 题，5 个维度各 12 题，正反各半 ============
   页面只有一个版本：测完直接出完整报告，不做二次收费，也没有激活码。
   PERM 是每个维度内部的取题顺序——打乱过的，避免正反题成组出现。 */
const DIMS_ALL = ['EI','SN','TF','JP','AT'];
const PERM = [0,7,2,9,4,11,6,1,8,3,10,5];
const PER_DIM = PERM.length;                       // 每个维度 12 题

const ITEMS = [];
DIMS_ALL.forEach(d => {
  PERM.forEach(k => ITEMS.push({d, dir:G[d][k][1], t:G[d][k][0]}));
});
const NQ = ITEMS.length;                           // 60

/* 题目按维度轮转交错，不连续出同维度的题 */
const ORDER = [];
for(let r=0;r<PER_DIM;r++) for(let g=0;g<DIMS_ALL.length;g++) ORDER.push(g*PER_DIM+r);

/* 进度条分 5 段，每段 12 题，答满一段点亮一格 */
const SEG_N = DIMS_ALL.length, PER_SEG = NQ / SEG_N;

let idx = 0, answers = new Array(NQ).fill(0);

/* ============ 交互 ============ */
function $(id){return document.getElementById(id);}
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  $(id).classList.add('on');
}
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1600);
}
const LS_KEY = 'mbti_p';
function save(){ try{ localStorage.setItem(LS_KEY,JSON.stringify({i:idx,a:answers})); }catch(e){} }

const REDUCED = typeof matchMedia==='function' && matchMedia('(prefers-reduced-motion: reduce)').matches;
let animToken = 0;

function startTest(resume){
  let ok=false;
  if(resume){ try{ const p=JSON.parse(localStorage.getItem(LS_KEY)||'null');
    if(p&&p.a&&p.a.length===NQ){ idx=p.i; answers=p.a; ok=true; } }catch(e){} }
  if(!ok){ idx=0; answers=new Array(NQ).fill(0); }
  if(!ok && resume) toast('没有找到可恢复的进度，从头开始');

  const seg=$('seg'); seg.innerHTML='';
  for(let g=0;g<SEG_N;g++) seg.innerHTML += '<i><b></b></i>';
  buildScale();
  paintProgress(true);
  renderQ(0);
  show('s-quiz');
}

/* 量表只构建一次，之后只切换选中态：拇指落点保持不动。
   设计取自参考图：圆圈直径编码强度、颜色编码方向。
   左端「同意」绿 → 中间最小灰（中立）→ 右端「不同意」紫。
   注意整槽都是点击热区，所以最小那颗圆也照样好点。 */
const SCALE_VAL = [7,6,5,4,3,2,1];
const SCALE_SZ  = [42,34,26,19,26,34,42];
const C_AGREE = '#2A9E6B', C_DISAGREE = '#6F5FB8', C_NEUTRAL = '#B4B2A9';
const SCALE_COL = [C_AGREE,C_AGREE,C_AGREE,C_NEUTRAL,C_DISAGREE,C_DISAGREE,C_DISAGREE];

function buildScale(){
  const sc=$('scale'); sc.innerHTML='';
  for(let i=0;i<7;i++){
    const b=document.createElement('button');
    b.className='dot';
    b.style.setProperty('--sz', SCALE_SZ[i]+'px');
    b.style.setProperty('--ring', SCALE_COL[i]);
    b.innerHTML='<i></i>';
    b.onclick=()=>pick(SCALE_VAL[i]);
    b.onmouseenter=()=>tipOn(SCALE_VAL[i]);
    b.onmouseleave=()=>$('scaleTip').classList.remove('on');
    sc.appendChild(b);
  }
}
function tipOn(v){
  const t=$('scaleTip');
  t.textContent=LABELS[v-1];
  t.style.color = v>4 ? C_AGREE : (v<4 ? C_DISAGREE : '#8A8D96');
  t.classList.add('on');
}

/* 进度条连续填充：每 12 题填满一格，而不是整格跳变 */
function paintProgress(instant){
  const done = answers.filter(a=>a>0).length;
  document.querySelectorAll('#seg i b').forEach((b,g)=>{
    const f = Math.max(0, Math.min(1, (done - g*PER_SEG)/PER_SEG));
    if(instant){
      b.style.transition='none'; b.style.width=(f*100)+'%';
      void b.offsetWidth; b.style.transition='';
    } else {
      b.style.width=(f*100)+'%';
    }
  });
}

function paintQ(){
  const it = ITEMS[ORDER[idx]], meta = DIM_META[it.d];
  $('qNow').textContent = idx+1;
  $('qTotal').textContent = NQ;
  $('qMind').textContent = meta.name;
  $('qText').textContent = it.t;
  $('btnBack').classList.toggle('hide', idx===0);
  $('scale').querySelectorAll('.dot').forEach((d,i)=>{
    d.classList.toggle('sel', answers[ORDER[idx]]===SCALE_VAL[i]);
  });
  $('scaleTip').classList.remove('on');
}

/* dir: 1 前进 / -1 回退 / 0 首次渲染（不做动画） */
function renderQ(dir){
  paintProgress(false);
  const stage = $('qStage');
  if(dir===0 || REDUCED || !stage.animate){ stage.style.opacity=''; paintQ(); return; }

  const my = ++animToken;
  const outY = dir===1 ? -14 : 14;
  const inY  = dir===1 ?  18 : -18;

  stage.animate(
    [{opacity:1,transform:'translateY(0) scale(1)'},
     {opacity:0,transform:'translateY('+outY+'px) scale(.985)'}],
    {duration:120, easing:'cubic-bezier(.4,0,1,1)'}
  ).finished.then(()=>{
    if(my!==animToken) return;
    stage.style.opacity='0';
    paintQ();
    stage.animate(
      [{opacity:0,transform:'translateY('+inY+'px) scale(.99)'},
       {opacity:1,transform:'translateY(0) scale(1)'}],
      {duration:240, easing:'cubic-bezier(.05,.7,.1,1)'}
    ).finished.then(()=>{ if(my===animToken) stage.style.opacity=''; }).catch(()=>{});
  }).catch(()=>{});
}

function pick(v){
  answers[ORDER[idx]] = v; save();
  const dots = $('scale').querySelectorAll('.dot');
  dots.forEach(d=>d.classList.remove('sel','pop'));
  const hit = dots[SCALE_VAL.indexOf(v)];
  hit.classList.add('sel');
  void hit.offsetWidth;
  hit.classList.add('pop');
  tipOn(v);
  paintProgress(false);
  setTimeout(()=>{
    if(idx===NQ-1){ finish(); } else { idx++; renderQ(1); }
  },150);
}
function prevQ(){ if(idx>0){ idx--; renderQ(-1); } }

/* ============ 计分 ============ */
function score(){
  const raw = {EI:0,SN:0,TF:0,JP:0,AT:0}, cnt = {EI:0,SN:0,TF:0,JP:0,AT:0};
  ITEMS.forEach((it,i)=>{
    const v = answers[i]; if(!v) return;
    raw[it.d] += (it.dir===1 ? v : 8-v);
    cnt[it.d] += 1;
  });
  const out={};
  Object.keys(raw).forEach(d=>{
    if(!cnt[d]) return;               // 该维度没有题目（精简版不含第五维）
    const n = cnt[d];
    const mn = n, mx = n*7;
    const pct = Math.round((raw[d]-mn)/(mx-mn)*100);
    out[d] = Math.max(1,Math.min(99,pct));
  });
  return out;
}

function finish(){
  show('s-calc');
  const bar=$('calcBar'), s=$('calcS');
  const steps = ['正在比对 16 种类型原型…','正在计算五个维度的倾向强度…',
                 '正在匹配你的认知功能排序…','正在生成人格画像…'];
  const last = steps.length - 1;
  let p=0;
  bar.style.width='0%';
  const timer=setInterval(()=>{
    p++; bar.style.width=(p*25)+'%';
    s.textContent=steps[Math.min(p,last)];
    if(p>=4){ clearInterval(timer); setTimeout(renderResult,380); }
  },430);
}

/* ============ 结果 ============ */
let R = null;
/* 把主题色往白色方向调，得到极浅的同色系底色 */
function mixWhite(hex, a){
  const n = parseInt(hex.slice(1), 16);
  const r = (n>>16)&255, g = (n>>8)&255, b = n&255;
  const m = v => Math.round(v*a + 255*(1-a));
  return 'rgb(' + m(r) + ',' + m(g) + ',' + m(b) + ')';
}

const DIM_ROWS = ['EI','SN','TF','JP','AT'];

function renderResult(){
  const p = score();
  const L = {
    EI: p.EI>=50?'E':'I', SN: p.SN>=50?'S':'N',
    TF: p.TF>=50?'T':'F', JP: p.JP>=50?'J':'P',
    AT: p.AT>=50?'A':'T5'
  };
  const code = L.EI+L.SN+L.TF+L.JP;
  const suffix = L.AT ? '-' + (L.AT==='A'?'A':'T') : '';
  const role = (L.SN==='N'&&L.TF==='T')?'analyst'
             : (L.SN==='N'&&L.TF==='F')?'diplomat'
             : (L.SN==='S'&&L.JP==='J')?'sentinel' : 'explorer';
  const info = TYPES[code], col = ROLE[role][1];
  R = {p,L,code,suffix,role,info,col};

  document.documentElement.style.setProperty('--accent', col);
  document.documentElement.style.setProperty('--accent-soft', mixWhite(col, 0.14));
  const hero=$('resHero');
  hero.style.background = col;
  hero.style.color = '#fff';
  hero.querySelectorAll('.res-line,.res-code').forEach(e=>e.style.color='#fff');
  $('resCode').textContent = code + suffix;
  $('resName').textContent = info[0] + '（' + code + '）';
  $('resRole').textContent = ROLE[role][0];
  $('resLine').textContent = info[1];

  // 整页底色取主题色的极浅调，让结果页从头到尾都是这一型的颜色
  $('s-result').style.background = mixWhite(col, 0.07);
  hero.style.paddingTop = 'calc(52px + env(safe-area-inset-top))';

  const dims=$('dims'); dims.innerHTML='';
  DIM_ROWS.forEach(d=>{
    const a=p[d], b=100-a, m=DIM_META[d];
    dims.innerHTML +=
      '<div class="dim"><div class="dim-top"><b>'+m.name+'</b><span>偏'+
      (a>=b? m.a[0] : m.b[0])+'</span></div>'+
      '<div class="dim-track"><i style="width:'+a+'%;background:'+col+'"></i>'+
      '<i style="width:'+b+'%;background:#DAD9D4"></i></div>'+
      '<div class="dim-key"><span>'+m.a[0]+' '+m.a[1]+' <b>'+a+'%</b></span>'+
      '<span><b>'+b+'%</b> '+m.b[1]+' '+m.b[0]+'</span></div></div>';
  });

  const sList=[], wList=[];
  [L.EI,L.SN,L.TF,L.JP,L.AT].forEach(k=>{
    (STRONG[k]||[]).forEach(x=>sList.push(x));
    (WEAK[k]||[]).forEach(x=>wList.push(x));
  });
  $('strengths').innerHTML = sList.slice(0,4).map(x=>'<span>'+x+'</span>').join('');
  $('weakness').innerHTML  = wList.slice(0,3).map(x=>'<span>'+x+'</span>').join('');

  buildReport();
  drawCard();
  show('s-result');
}


/* ============ 分享卡片 ============ */
function drawCard(){
  const c=$('shareCanvas'), x=c.getContext('2d');
  const W=c.width,H=c.height, col=R.col;
  x.clearRect(0,0,W,H);
  x.fillStyle='#FFFFFF'; x.fillRect(0,0,W,H);
  x.fillStyle=col; x.fillRect(0,0,W,400);
  for(let i=0;i<7;i++){
    x.fillStyle='rgba(255,255,255,'+(0.06+(i%3)*0.05)+')';
    x.beginPath(); x.arc(60+((i*97)%570),40+((i*61)%300),28+(i*11)%46,0,7); x.fill();
  }

  x.textAlign='center';
  x.fillStyle='#fff';
  x.font='700 84px -apple-system,"PingFang SC",sans-serif';
  x.fillText(R.code+R.suffix, W/2, 250);
  x.font='600 32px -apple-system,"PingFang SC",sans-serif';
  x.fillText(R.info[0], W/2, 314);
  x.font='400 21px -apple-system,"PingFang SC",sans-serif';
  x.fillStyle='rgba(255,255,255,.85)';
  x.fillText(ROLE[R.role][0], W/2, 354);

  x.font='400 23px -apple-system,"PingFang SC",sans-serif';
  x.fillStyle='#5B5F6B';
  wrap(x, R.info[1], W/2, 452, 560, 36);

  [['EI','E','I'],['SN','S','N'],['TF','T','F'],['JP','J','P']].forEach(([d,la,lb],i)=>{
    const y=576+i*82, a=R.p[d], b=100-a, m=DIM_META[d];
    // 百分比跟在自己那一侧，避免中间浮一个数值说不清属于谁
    x.textAlign='left'; x.font='500 22px -apple-system,"PingFang SC",sans-serif';
    x.fillStyle = a>=b ? '#24262F' : '#9A9DA8';
    x.fillText(m.a[0] + ' ' + a + '%', 70, y);
    x.textAlign='right';
    x.fillStyle = b>a ? '#24262F' : '#9A9DA8';
    x.fillText(b + '% ' + m.b[0], W-70, y);
    const bw=W-140, by=y+14, cw=bw*a/100;
    x.fillStyle='#EDECE8'; x.fillRect(70,by,bw,10);
    x.fillStyle=col; x.fillRect(70,by,cw,10);
  });

  x.textAlign='center';
  x.fillStyle='#9A9DA8'; x.font='400 19px -apple-system,"PingFang SC",sans-serif';
  x.fillText(CARD_FOOT_TEXT || '16 型人格测评 · 测测你是哪一种', W/2, 978);
  x.fillStyle='#24262F';
  x.fillRect(W/2-40, 1004, 80, 3);

  exportCard(c);
}

/* ============ 分享 ============ */
const UA_STR = navigator.userAgent || '';
const IN_WECHAT = /MicroMessenger/i.test(UA_STR);
const IS_IOS = /iPhone|iPad|iPod/i.test(UA_STR);

function cardFile(){
  return new Promise(function(resolve){
    const cv = $('shareCanvas');
    const name = '人格类型-' + (R ? R.code : 'MBTI') + '.png';
    const pack = function(blob){
      if(!blob){ resolve(null); return; }
      try{ resolve(new File([blob], name, {type:'image/png'})); }
      catch(e){ resolve(blob); }
    };
    if(cv.toBlob){ cv.toBlob(pack, 'image/png'); return; }
    try{
      const bin = atob(cv.toDataURL('image/png').split(',')[1]);
      const arr = new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
      pack(new Blob([arr], {type:'image/png'}));
    }catch(e){ pack(null); }
  });
}

/* 优先唤起系统分享面板；面板里就包含微信、朋友圈、QQ、微博等 */
async function shareCard(){
  if(!R){ toast('还没有生成结果'); return; }
  const file = await cardFile();
  if(file && navigator.canShare){
    try{
      if(navigator.canShare({files:[file]})){
        await navigator.share({
          files:[file],
          title:'我的人格类型是 ' + R.code + ' · ' + R.info[0],
          text:R.info[1]
        });
        return;
      }
    }catch(e){
      if(e && e.name === 'AbortError') return;   // 用户主动取消，不走兜底
    }
  }
  openSheet();
}

function openSheet(){
  const n = $('sheetNote');
  if(IN_WECHAT){

function copyLink(){
  const url = location.href;
  const done = function(){ toast('链接已复制，粘贴到微信发送'); closeSheet(); };
  const fallback = function(){
    const t = document.createElement('textarea');
    t.value = url;
    t.style.cssText = 'position:fixed;top:-1000px;opacity:0';
    document.body.appendChild(t);
    t.select();
    let ok = false;
    try{ ok = document.execCommand('copy'); }catch(e){}
    t.remove();
    ok ? done() : toast('复制失败，请手动复制地址栏链接');
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(done).catch(fallback);
  } else { fallback(); }
}

}

function wrap(x,text,cx,y,maxW,lh){
  let line='', yy=y;
  for(const ch of text){
    if(x.measureText(line+ch).width>maxW){ x.fillText(line,cx,yy); line=ch; yy+=lh; }
    else line+=ch;
  }
  if(line) x.fillText(line,cx,yy);
}

const REP_TAIL = '<p class="rep-tail">本报告基于荣格心理类型学框架与你本次的作答生成，用于自我认识与沟通参考，不作为心理诊断或职业决策的唯一依据。</p>';

function buildReport(){
  const box = $('reportBox'); if(!box) return;
  box.innerHTML = fullReportHTML();
}

function fullReportHTML(){
  const L = R.L, code = R.code, role = R.role, col = R.col, info = R.info;
  const out = [];

  out.push('<div class="rep"><h3 class="rep-h">认知功能排序</h3><div class="cf">');
  ['主导功能','辅助功能','第三功能','劣势功能'].forEach(function(t,i){
    const f = fn(code,i);
    out.push('<div class="cf-row"><div class="cf-badge" style="background:'+(i===0?col:'#C9C7BE')+'">'+f+
      '</div><div class="cf-body"><b>'+t+' · '+CF_DESC[f][0]+'</b><span>'+CF_DESC[f][1]+'</span></div></div>');
  });
  out.push('</div><p class="rep-note">主导与辅助功能是你最自然的思考方式，用起来毫不费力；劣势功能是压力下最容易失衡的地方——它不会消失，但可以被有意识地训练。</p></div>');

  out.push('<div class="rep"><h3 class="rep-h">你的类型画像</h3>'+
    '<p class="rep-t">'+ROLE_INTRO[role]+'</p>'+
    '<p class="rep-t">'+info[0]+'（'+code+R.suffix+'）是「'+ROLE[role][0]+'」中的一员。'+CORE[code]+'</p></div>');

  out.push('<div class="rep"><h3 class="rep-h">五个维度的详细解读</h3>'+dimNarr()+'</div>');
  out.push('<div class="rep"><h3 class="rep-h">适合的职业方向</h3>'+careerLong(code,L)+'</div>');
  out.push('<div class="rep"><h3 class="rep-h">职场中的沟通方式</h3>'+workComm(L)+'</div>');
  out.push('<div class="rep"><h3 class="rep-h">恋爱与依恋模式</h3>'+loveLong(L)+'</div>');
  out.push('<div class="rep"><h3 class="rep-h">压力与内耗来源</h3><p class="rep-t">'+stressLong(L)+'</p></div>');
  out.push('<div class="rep"><h3 class="rep-h">可执行的成长路径</h3>'+growLong(L)+'</div>');
  out.push('<div class="rep"><h3 class="rep-h">给身边人的相处指南</h3>'+
    '<p class="rep-t" style="color:var(--ink2)">这一节可以直接转给家人、伴侣或同事看。</p>'+
    socialTips(L)+'</div>');
  out.push('<div class="rep"><h3 class="rep-h">你与相近类型的区别</h3>'+neighborText(code)+'</div>');
  out.push(REP_TAIL);
  return out.join('');
}

/* 认知功能栈推导（标准 MBTI 规则）
   功能名写作「功能字母 + 态度」：Te = 外倾思考，Ni = 内倾直觉。
   J 型让判断功能(T/F)外倾，P 型让感知功能(S/N)外倾；E 型外倾的那个当主导，I 型当辅助。
   第三功能 = 辅助功能的「同层对面」，劣势功能 = 主导功能的「同层对面」。 */
const CF_CAT = {T:'F', F:'T', S:'N', N:'S'};
function flipFn(f){ return CF_CAT[f[0]] + (f[1]==='e' ? 'i' : 'e'); }
function fn(code,i){
  const e = code[0];
  const P  = code[1]==='S' ? 'S' : 'N';   // 感知功能
  const Jf = code[2]==='T' ? 'T' : 'F';   // 判断功能
  let dom, aux;
  if(code[3]==='J'){
    if(e==='E'){ dom = Jf+'e'; aux = P+'i'; }
    else       { dom = P+'i';  aux = Jf+'e'; }
  } else {
    if(e==='E'){ dom = P+'e';  aux = Jf+'i'; }
    else       { dom = Jf+'i'; aux = P+'e'; }
  }
  const order = [dom, aux, flipFn(aux), flipFn(dom)];
  return order[i];
}
function career(code){
  const M={INTJ:'战略、架构、投研、产品负责人',INTP:'研究、算法、系统架构、学术',
    ENTJ:'管理、创业、商务拓展',ENTP:'创新业务、咨询、内容创作',
    INFJ:'心理咨询、教育、公益、内容',INFP:'写作、设计、品牌、心理相关',
    ENFJ:'教育培训、人力、公关',ENFP:'市场、创意策划、社群',
    ISTJ:'财务、审计、法务、运营',ISFJ:'医疗护理、行政、客服管理',
    ESTJ:'项目管理、运营、销售管理',ESFJ:'客户成功、教育、行政',
    ISTP:'工程、技术运维、手艺类',ISFP:'设计、摄影、手工、美学相关',
    ESTP:'销售、商务、创业、应急类',ESFP:'演艺、活动、直播、体验类'};
  return M[code];
}
function stressLong(L){
  const s=[];
  if(L.EI==='I') s.push('过度社交之后的能量透支'); else s.push('长时间没有人互动');
  if(L.JP==='J') s.push('计划被反复临时打乱'); else s.push('被截止日期和琐事逼着收口');
  s.push(L.AT==='T5' ? '对自己的反复审视与自我怀疑' : '被他人的低效拖慢节奏');
  const tail = (L.EI==='I'
      ? '这些消耗对你来说不是"心情不好"，而是实打实的电量下降——它需要的是独处恢复，而不是被人劝"别想太多"。'
      : '这些消耗会直接表现为烦躁和坐不住——你需要的是新的输入或一场痛快的行动，而不是被按着静下来。')
    + (L.JP==='J'
      ? '一个有效的做法是：把不可控的变量提前写下来，并允许其中有 20% 是弹性的，这样临时变化就不再等于失控。'
      : '一个有效的做法是：给自己设一个"必须收口的时刻"，哪怕产出还不完美，也先交付一个版本。');
  return '你的主要压力源是：'+s.join('、')+'。'+tail;
}
function growLong(L){
  const a = (L.SN==='N'
    ? '第一件事：把"想到"落成"做到"。每周固定交出一个可被看见的小产出，不要等想法成熟——它在交付的过程中才会成熟。'
    : '第一件事：动手之前先花十分钟问自己一句"这件事的长期价值是什么"，避免把效率用在错误的方向上。');
  const b = (L.TF==='T'
    ? '第二件事：重要对话之前，先在心里复述一遍对方的处境和感受，再去组织你的论点。'
    : '第二件事：做重要决定时，给自己设一个不带情绪的冷静期——把"我不想伤害他"和"这件事本身对不对"分开来看。');
  const c = (L.AT==='T5'
    ? '第三件事：把"我是不是做错了"换成"我下次具体改哪一点"。注意力从自我评价转移到可执行的动作上，内耗会下降得非常明显。'
    : '第三件事：主动找一两个愿意给你逆耳反馈的人。你不太容易被评价带走是优势，但也意味着坏消息可能没人敢告诉你。');
  return '<p class="rep-t">'+a+'</p><p class="rep-t">'+b+'</p><p class="rep-t">'+c+'</p>';
}
function restart(){
  if(!confirm('确定要重新测试吗？当前结果会被清空。')) return;
  try{ localStorage.removeItem(LS_KEY); }catch(e){}
  idx=0; answers=new Array(NQ).fill(0);
  show('s-cover');
}
